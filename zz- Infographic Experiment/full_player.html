/**
 * MASTER CHARACTER LIBRARY: THE INFOGRAPHICS SKELETAL RIG (REVISION 3 - TRUE HUMAN MOVEMENT)
 * 
 * 1. 2D Forward Kinematics (FK) Joint Hierarchy:
 *    - Neck: Base (0, 20) -> Head pivot (0, 10), tilt [-18 deg, +18 deg]
 *    - Left Arm:  Shoulder (-52, 36) -> Elbow (L1=65) -> Wrist (L2=55) -> Hand
 *    - Right Arm: Shoulder (+52, 36) -> Elbow (L1=65) -> Wrist (L2=55) -> Hand
 *    - Left Leg:  Hip (-22, 155) -> Knee (L1=60) -> Ankle (L2=55) -> Shoe
 *    - Right Leg: Hip (+22, 155) -> Knee (L1=60) -> Ankle (L2=55) -> Shoe
 * 
 * 2. True Human Biomechanical Laws:
 *    - Upper arm swings outward/upward:
 *      * Left:  alpha_s = 90 deg + theta_s
 *      * Right: alpha_s = 90 deg - theta_s
 *    - Elbow flexes UPWARD and TOWARD BODY (flexion):
 *      * Left:  alpha_f = alpha_s + theta_e  (Forearm bends UP-IN toward head/chest)
 *      * Right: alpha_f = alpha_s - theta_e  (Forearm bends UP-IN toward head/chest)
 *    - Elbow Flexion Range: theta_e in [0 deg, 140 deg] (Zero backward bending)
 *    - Shoulder Range: theta_s in [-20 deg, 155 deg] (Zero 360-degree spin)
 * 
 * 3. Airtight Prop Attachment:
 *    - Banknote is clamped directly inside the hand's fingers at (Wx, Wy)
 *    - Hand palm behind bill -> Bill -> Thumb & curled fingers in front of bill (Zero mid-air floating)
 */

const MASTER_CHARACTER_SPEC = {
  version: "3.0.0-human-kinematics",
  name: "Infographics Host (The $5 Investor)",
  proportions: {
    height: 380,
    headWidth: 120,
    headHeight: 140,
    torsoWidth: 116,
    torsoHeight: 135,
    armUpperLength: 65,
    armForeLength: 55,
    legThighLength: 60,
    legShinLength: 55
  },
  palette: {
    skin: "#fcd5b4",
    skinShadow: "#f0b992",
    blush: "#fb7185",
    hoodieMain: "#2563eb",
    hoodieShadow: "#1d4ed8",
    hoodieDrawstring: "#f8fafc",
    hair: "#1e1e1e",
    mouthDark: "#881337",
    pants: "#1e293b",
    pantsOutline: "#0f172a",
    shoes: "#f8fafc",
    shoesStripe: "#ef4444",
    billMain: "#10b981",
    billLight: "#ecfdf5",
    billDark: "#065f46"
  },
  jointPivots: {
    neck: { x: 0, y: 10 },
    leftShoulder: { x: -52, y: 36 },
    rightShoulder: { x: 52, y: 36 },
    leftHip: { x: -22, y: 155 },
    rightHip: { x: 22, y: 155 }
  }
};

function clampBiometrics(val, min, max) {
  return Math.min(Math.max(val, min), max);
}

/**
 * Forward Kinematics Arm Solver (True Human Biomechanics)
 * @param {'left' | 'right'} side
 * @param {number} shoulderAngle - degrees from resting down [0 = straight down, 30 = down-out, 90 = horizontal, 140 = high up]
 * @param {number} elbowFlexion  - degrees of inward bend [0 = straight, 90 = right-angle bend UPWARD, 130 = hand near chest/face]
 */
function solveArmKinematics(side, shoulderAngle, elbowFlexion) {
  const S = (side === 'left') 
    ? { x: MASTER_CHARACTER_SPEC.jointPivots.leftShoulder.x, y: MASTER_CHARACTER_SPEC.jointPivots.leftShoulder.y }
    : { x: MASTER_CHARACTER_SPEC.jointPivots.rightShoulder.x, y: MASTER_CHARACTER_SPEC.jointPivots.rightShoulder.y };

  // Biomechanical safety constraints
  const sClamped = clampBiometrics(shoulderAngle, -20, 155);
  const eClamped = clampBiometrics(elbowFlexion, 0, 140); // Elbow cannot bend backward!

  const L1 = MASTER_CHARACTER_SPEC.proportions.armUpperLength;
  const L2 = MASTER_CHARACTER_SPEC.proportions.armForeLength;

  let alphaS, alphaF;
  if (side === 'left') {
    // Upper arm swings outward to the left (90 deg is straight down, 90 + s swings to left and up)
    alphaS = (90 + sClamped) * (Math.PI / 180);
    // Flexion bends UPWARD and TOWARDS the head/chest (increasing angle toward -Y)
    alphaF = (90 + sClamped + eClamped) * (Math.PI / 180);
  } else {
    // Upper arm swings outward to the right (90 deg is straight down, 90 - s swings to right and up)
    alphaS = (90 - sClamped) * (Math.PI / 180);
    // Flexion bends UPWARD and TOWARDS the head/chest (decreasing angle toward -Y)
    alphaF = (90 - sClamped - eClamped) * (Math.PI / 180);
  }

  const Ex = S.x + L1 * Math.cos(alphaS);
  const Ey = S.y + L1 * Math.sin(alphaS);

  const Wx = Ex + L2 * Math.cos(alphaF);
  const Wy = Ey + L2 * Math.sin(alphaF);

  // Angle of the forearm in degrees
  const forearmDeg = alphaF * (180 / Math.PI);

  return {
    shoulder: S,
    elbow: { x: Ex, y: Ey },
    wrist: { x: Wx, y: Wy },
    forearmAngle: forearmDeg,
    shoulderAngleClamped: sClamped,
    elbowFlexionClamped: eClamped
  };
}

/**
 * Forward Kinematics Leg Solver
 */
function solveLegKinematics(side, hipAngle = 0, kneeFlexion = 0) {
  const H = (side === 'left')
    ? { x: MASTER_CHARACTER_SPEC.jointPivots.leftHip.x, y: MASTER_CHARACTER_SPEC.jointPivots.leftHip.y }
    : { x: MASTER_CHARACTER_SPEC.jointPivots.rightHip.x, y: MASTER_CHARACTER_SPEC.jointPivots.rightHip.y };

  const hClamped = clampBiometrics(hipAngle, -25, 35);
  const kClamped = clampBiometrics(kneeFlexion, 0, 110);

  const Lthigh = MASTER_CHARACTER_SPEC.proportions.legThighLength;
  const Lshin = MASTER_CHARACTER_SPEC.proportions.legShinLength;

  const alphaH = (90 + hClamped) * (Math.PI / 180);
  const Kx = H.x + Lthigh * Math.cos(alphaH);
  const Ky = H.y + Lthigh * Math.sin(alphaH);

  // Knee backward flexion
  const alphaK = (90 + hClamped - kClamped) * (Math.PI / 180);
  const Ax = Kx + Lshin * Math.cos(alphaK);
  const Ay = Ky + Lshin * Math.sin(alphaK);

  return {
    hip: H,
    knee: { x: Kx, y: Ky },
    ankle: { x: Ax, y: Ay }
  };
}

function verifyPoseBiometrics(poseParams) {
  const diagnostics = [];
  let isValid = true;

  if (poseParams.leftArm.elbowFlexion < 0) {
    isValid = false;
    diagnostics.push(`Left elbow hyperextended backwards (${poseParams.leftArm.elbowFlexion} deg). Must be >= 0 deg.`);
  }
  if (poseParams.rightArm.elbowFlexion < 0) {
    isValid = false;
    diagnostics.push(`Right elbow hyperextended backwards (${poseParams.rightArm.elbowFlexion} deg). Must be >= 0 deg.`);
  }
  if (poseParams.leftArm.shoulderAngle > 165 || poseParams.leftArm.shoulderAngle < -30) {
    isValid = false;
    diagnostics.push(`Left shoulder out of human range (${poseParams.leftArm.shoulderAngle} deg).`);
  }
  if (poseParams.rightArm.shoulderAngle > 165 || poseParams.rightArm.shoulderAngle < -30) {
    isValid = false;
    diagnostics.push(`Right shoulder out of human range (${poseParams.rightArm.shoulderAngle} deg).`);
  }

  return {
    valid: isValid,
    score: isValid ? 100 : 0,
    diagnostics: diagnostics.length ? diagnostics : ["All joints within strict anatomical bounds (Zero backward bends, zero 360-degree spins)."]
  };
}

// 1. SPATIAL ZONING CONTRACTS
const SPATIAL_ZONES = {

// 2. CALCULUS TANGENT ENGINE FOR BEZIER CURVES
// Quadratic Bezier: B(p) = (1-p)^2 * P0 + 2(1-p)p * P1 + p^2 * P2
function getQuadraticBezierPointAndTangent(p0, p1, p2, p) {
  const t = Math.min(Math.max(p, 0), 1);
  
  // Position B(t)
  const x = Math.pow(1 - t, 2) * p0.x + 2 * (1 - t) * t * p1.x + Math.pow(t, 2) * p2.x;
  const y = Math.pow(1 - t, 2) * p0.y + 2 * (1 - t) * t * p1.y + Math.pow(t, 2) * p2.y;

  // First Derivative B'(t) = 2(1-t)(P1 - P0) + 2t(P2 - P1)
  const dx = 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
  const dy = 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);

  // Tangent angle in degrees. Adding 90 deg because default rocket points UP (negative Y)
  const angleDeg = (Math.atan2(dy, dx) * 180 / Math.PI) + 90;

  return { x, y, dx, dy, angleDeg };
}

    /**
 * AGENT 5: CONTINUITY & TRANSITION DIRECTOR (REVISION 3 - 50% MIDPOINT SWITCHING)
 * 
 * Enforces the Golden Motion Graphics Rule:
 * Base scene N switches to scene N+1 at the EXACT MIDPOINT of the transition overlay
 * when the screen is fully masked or covered, ensuring zero visual pops or abrupt cuts.
 */

function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

function clamp(val, min, max) {
  return Math.min(Math.max(val, min), max);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function getContinuityState(currentTime) {
  const t = clamp(currentTime, 0, 26.85);

  let activeBaseScene = 1;
  let cameraX = 0;
  let cameraY = 0;
  let cameraScale = 1.0;
  let screenShakeX = 0;
  let screenShakeY = 0;
  let transitionOverlaySvg = '';

  // 1. SCENE 1 (0.00s - 4.40s)
  if (t < 4.40) {
    activeBaseScene = 1;
    cameraScale = lerp(1.0, 1.04, t / 4.40);
  }
  // TRANSITION 1 -> 2 (4.40s - 5.10s, Midpoint: 4.75s)
  else if (t >= 4.40 && t < 5.10) {
    const p = (t - 4.40) / 0.70;
    const eased = easeInOutCubic(p);
    
    // 50% MIDPOINT RULE: Switch base scene at 4.75s (p = 0.5)
    activeBaseScene = (p < 0.5) ? 1 : 2;
    
    // Camera whip pan
    cameraX = lerp(0, -1920, eased);
    if (activeBaseScene === 2) {
      cameraX += 1920; // Re-anchor camera to Scene 2 origin
    }

    const whipOpacity = Math.sin(p * Math.PI) * 0.7;
    transitionOverlaySvg = `
      <g id="whip_speed_lines" opacity="${whipOpacity}">
        <rect x="0" y="0" width="1920" height="1080" fill="#020617" opacity="${whipOpacity * 0.6}"/>
        <line x1="100" y1="220" x2="1820" y2="220" stroke="#38bdf8" stroke-width="6" stroke-dasharray="160 80"/>
        <line x1="200" y1="540" x2="1720" y2="540" stroke="#ffffff" stroke-width="8" stroke-dasharray="240 100"/>
        <line x1="80" y1="820" x2="1840" y2="820" stroke="#38bdf8" stroke-width="6" stroke-dasharray="180 90"/>
      </g>
    `;
  }
  // 2. SCENE 2 (5.10s - 9.30s)
  else if (t >= 5.10 && t < 9.30) {
    activeBaseScene = 2;
    cameraScale = lerp(1.0, 1.05, (t - 5.10) / 4.20);
  }
  // TRANSITION 2 -> 3 (9.30s - 10.10s, Midpoint: 9.70s)
  else if (t >= 9.30 && t < 10.10) {
    const p = (t - 9.30) / 0.80;
    const eased = easeInOutCubic(p);
    
    // 50% MIDPOINT RULE: Switch base scene at 9.70s
    activeBaseScene = (p < 0.5) ? 2 : 3;

    cameraScale = lerp(1.05, 1.35, eased);
    cameraY = lerp(0, 60, eased);
    if (activeBaseScene === 3) {
      cameraScale = lerp(1.35, 1.0, (p - 0.5) * 2);
      cameraY = lerp(60, 0, (p - 0.5) * 2);
    }
  }
  // 3. SCENE 3 (10.10s - 15.70s)
  else if (t >= 10.10 && t < 15.70) {
    activeBaseScene = 3;
    // WRONG! Stamp screen shake at 12.04s - 12.50s
    if (t >= 12.04 && t < 12.50) {
      const shakeProgress = (t - 12.04) / 0.46;
      const decay = 1 - shakeProgress;
      screenShakeX = Math.sin(t * 70) * 20 * decay;
      screenShakeY = Math.cos(t * 80) * 16 * decay;
    }
    cameraScale = 1.0;
  }
  // TRANSITION 3 -> 4 (15.70s - 16.50s, Midpoint: 16.10s)
  else if (t >= 15.70 && t < 16.50) {
    const p = (t - 15.70) / 0.80;
    const eased = easeInOutCubic(p);

    // 50% MIDPOINT RULE: Switch from Scene 3 to Scene 4 at 16.10s (p = 0.5)
    activeBaseScene = (p < 0.5) ? 3 : 4;

    const wipeX = lerp(-800, 2800, eased);
    transitionOverlaySvg = `
      <g id="diagonal_wipe">
        <!-- Giant Solid Emerald Energy Shield -->
        <polygon points="${wipeX - 600},-120 ${wipeX + 600},-120 ${wipeX + 200},1200 ${wipeX - 1000},1200" 
                 fill="#10b981"/>
        <line x1="${wipeX + 600}" y1="-120" x2="${wipeX + 200}" y2="1200" 
              stroke="#34d399" stroke-width="24"/>
        <line x1="${wipeX + 620}" y1="-120" x2="${wipeX + 220}" y2="1200" 
              stroke="#ffffff" stroke-width="8"/>
      </g>
    `;
  }
  // 4. SCENE 4 (16.50s - 24.80s)
  else if (t >= 16.50 && t < 24.80) {
    activeBaseScene = 4;
    cameraScale = lerp(1.0, 1.06, (t - 16.50) / 8.30);
  }
  // TRANSITION 4 -> 5 (24.80s - 25.35s, Midpoint: 25.07s)
  else if (t >= 24.80 && t < 25.35) {
    const p = (t - 24.80) / 0.55;

    // 50% MIDPOINT RULE: Switch from Scene 4 to Scene 5 at 25.07s (p = 0.5)
    activeBaseScene = (p < 0.5) ? 4 : 5;

    const burstScale = lerp(0.1, 4.5, easeOutBack(p));
    const burstOpacity = clamp(Math.sin(p * Math.PI) * 1.4, 0, 1);
    transitionOverlaySvg = `
      <g id="climax_burst" transform="translate(960, 540) scale(${burstScale})" opacity="${burstOpacity}">
        <circle cx="0" cy="0" r="450" fill="#facc15" opacity="0.9"/>
        <circle cx="0" cy="0" r="320" fill="#ffffff"/>
        <polygon points="0,-500 45,-90 500,0 90,45 0,500 -45,90 -500,0 -90,-45" fill="#f59e0b"/>
      </g>
    `;
  }
  // 5. SCENE 5 (25.35s - 26.85s)
  else {
    activeBaseScene = 5;
    cameraScale = lerp(1.0, 1.04, (t - 25.35) / 1.50);
  }

  return {
    t,
    activeBaseScene,
    cameraX,
    cameraY,
    cameraScale,
    screenShakeX,
    screenShakeY,
    transitionOverlaySvg
  };
}

    const by0 = uy * (t - 0.08);

    // --- 6. SCENE 1 ANIMATOR ---
    /**
 * AGENT 3: KINETIC ANIMATOR (SCENE 1 ENGINE)
 * Drives Scene 1 visuals and character presentation
 */


function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

function clamp(val, min, max) {
  return Math.min(Math.max(val, min), max);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function computeScene1Frame(currentTime, includeCaptions = false) {
  const t = clamp(currentTime, 0, 4.85);

  // Character Entrance Bounce (0.0s to 0.75s)
  let charY = 0;
  let charScale = 1;
  if (t < 0.75) {
    const p = t / 0.75;
    const eased = easeOutBack(p);
    charY = lerp(160, 0, eased);
    charScale = lerp(0.85, 1, eased);
  }

  // Head Tilt & Wonder
  let headTilt = 0;
  if (t < 1.2) {
    headTilt = lerp(0, -5, t / 1.2);
  } else if (t < 2.8) {
    const p = (t - 1.2) / 1.6;
    headTilt = lerp(-5, 6, p);
  } else {
    const p = (t - 2.8) / 2.05;
    headTilt = lerp(6, -2, p);
  }

  // Eye Blink Cycle (2.30s and 4.05s)
  let blink = 0;
  if ((t >= 2.30 && t <= 2.45) || (t >= 4.05 && t <= 4.20)) {
    blink = 1;
  }

  // Eye Gaze
  let eyeLookX = (t > 1.2 && t < 2.5) ? -2.5 : Math.sin(t * 1.5) * 1.2;
  let eyeLookY = (t > 1.2 && t < 2.5) ? -1 : 0;

  // Hero Badge Pop-in
  let badgeScale = 0;
  let badgeOpacity = 0;
  if (t >= 1.30) {
    const p = clamp((t - 1.30) / 0.45, 0, 1);
    badgeScale = easeOutBack(p);
    badgeOpacity = clamp(p * 2, 0, 1);
  }

  // Question Marks Pop
  let questionScale = 0;
  let questionOpacity = 0;
  if (t >= 0.35 && t < 2.9) {
    const p = clamp((t - 0.35) / 0.4, 0, 1);
    questionScale = easeOutBack(p);
    questionOpacity = (t > 2.4) ? clamp(1 - (t - 2.4) / 0.5, 0, 1) : 1;
  }

  // Calendar Sheets Drift
  let calendarOffset = (t >= 1.8) ? (t - 1.8) / 3.05 : 0;

  // Subtle Idle Breathing
  const breathScale = 1.0 + Math.sin(t * 4.5) * 0.015;

  const sceneEnvironmentSvg = renderSceneEnvironment({
    calendarOffset,
    badgeScale,
    badgeOpacity,
    questionScale,
    questionOpacity,
    gridPulse: 1 + Math.sin(t * 2) * 0.2
  });

  const characterSvg = renderCharacter({
    pose: (t >= 1.05) ? "PRESENT_BILL" : "IDLE",
    headTilt,
    blink,
    breathScale,
    browPosition: clamp(t / 2.0, 0, 1),
    eyeLookX,
    eyeLookY,
    billScale: clamp((t - 1.05) / 0.4, 0, 1)
  });

  return `
    <g id="scene1_container">
      ${sceneEnvironmentSvg}
      <g id="character_wrapper" transform="translate(960, ${465 + charY}) scale(${charScale})">
        ${characterSvg}
      </g>
    </g>
  `;
}

 * Features:
 * - Integrates all 5 scenes under the Orchestrator's spatial zoning protocol
 * - Renders single-layer 18 chunked non-overlapping subtitles (ZERO DUPLICATION)

 */


function computeMasterFrame(currentTime) {
  const t = Math.min(Math.max(currentTime, 0), 26.85);

  let sceneContent = '';

  // 50% Midpoint Scene Selection
  if (continuity.activeBaseScene === 1) {

  } else if (continuity.activeBaseScene === 2) {
    sceneContent = renderScene2(t);
  } else if (continuity.activeBaseScene === 3) {
    sceneContent = renderScene3(t);
  } else if (continuity.activeBaseScene === 4) {
    sceneContent = renderScene4(t);
  } else {

          <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#dc2626" flood-opacity="0.6"/>

      </defs>

      <!-- AGENT 5 CAMERA & CONTINUITY RIG -->
      <g transform="translate(${960 + continuity.screenShakeX}, ${540 + continuity.screenShakeY}) scale(${continuity.cameraScale}) translate(${-960 + continuity.cameraX}, ${-540 + continuity.cameraY})">
        <!-- Scene Base Layer -->
        ${sceneContent}

        ${continuity.transitionOverlaySvg}

      <!-- FIXED CAPTIONS LAYER (Zone: y = 860 to 1080) -->
      ${captionSvg}

}


    // --- 8. MASTER UI CONTROLLER ---
    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('stage');
      const audio = document.getElementById('voiceover-audio');
      const playBtn = document.getElementById('play-btn');
      const restartBtn = document.getElementById('restart-btn');
      const timelineSlider = document.getElementById('timeline-slider');
      const currentTimeDisplay = document.getElementById('current-time');
      const activeScenePill = document.getElementById('active-scene-pill');
      const sceneIndicator = document.getElementById('scene-indicator');

      const TOTAL_DURATION = 26.85;
      let isPlaying = false;
      let animFrameId = null;
      let fallbackTime = 0.0;
      let lastTimestamp = 0;

      function getSceneTitle(t) {
        if (t < 4.40) return { name: 'Scene 1: The Hook', num: '1 / 5' };
        if (t < 5.10) return { name: 'Transition: Studio ➔ Bedroom (50% Midpoint)', num: 'T 1➔2' };
        if (t < 9.30) return { name: 'Scene 2: The Mattress Stash', num: '2 / 5' };
        if (t < 10.10) return { name: 'Transition: Punch-in Freeze', num: 'T 2➔3' };
        if (t < 15.70) return { name: 'Scene 3: The Inflation Threat', num: '3 / 5' };
        if (t < 16.50) return { name: 'Transition: Emerald Wipe (50% Midpoint)', num: 'T 3➔4' };
        if (t < 24.80) return { name: 'Scene 4: S&P 500 Rocket Engine', num: '4 / 5' };
        if (t < 25.35) return { name: 'Transition: Climax Starburst', num: 'T 4➔5' };
        return { name: 'Scene 5: START TODAY', num: '5 / 5' };
      }

      // Global hook for Diagnostic Auditor
      window.seekTo = function(seconds) {
        const t = Math.min(Math.max(seconds, 0), TOTAL_DURATION);
        timelineSlider.value = t;
        currentTimeDisplay.textContent = t.toFixed(2) + 's';
        const sc = getSceneTitle(t);
        activeScenePill.textContent = sc.name;
        sceneIndicator.textContent = 'SCENE ' + sc.num;
        stage.innerHTML = computeMasterFrame(t);
        fallbackTime = t;
      };

      function update(now) {
        if (isPlaying) {
          let t = 0;
          if (!audio.paused && !isNaN(audio.currentTime) && audio.currentTime > 0) {
            t = audio.currentTime;
          } else {
            if (!lastTimestamp) lastTimestamp = now;
            const dt = (now - lastTimestamp) / 1000;
            fallbackTime += dt;
            lastTimestamp = now;
            t = fallbackTime;
          }

          if (t >= TOTAL_DURATION) {
            try { audio.pause(); } catch(e) {}
            audio.currentTime = 0;
            fallbackTime = 0;
            isPlaying = false;
            playBtn.innerHTML = '▶ Play';
            window.seekTo(0);
            return;
          }

          timelineSlider.value = t;
          currentTimeDisplay.textContent = t.toFixed(2) + 's';
          const sc = getSceneTitle(t);
          activeScenePill.textContent = sc.name;
          sceneIndicator.textContent = 'SCENE ' + sc.num;
          stage.innerHTML = computeMasterFrame(t);

          animFrameId = requestAnimationFrame(update);
        }
      }

      function togglePlay() {
        if (isPlaying) {
          try { audio.pause(); } catch(e) {}
          isPlaying = false;
          playBtn.innerHTML = '▶ Play';
          cancelAnimationFrame(animFrameId);
        } else {
          if (timelineSlider.value >= TOTAL_DURATION) {
            window.seekTo(0);
          }
          fallbackTime = parseFloat(timelineSlider.value) || 0;
          lastTimestamp = performance.now();
          audio.currentTime = fallbackTime;

          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              isPlaying = true;
              playBtn.innerHTML = '❚❚ Pause';
              animFrameId = requestAnimationFrame(update);
            }).catch(err => {
              isPlaying = true;
              playBtn.innerHTML = '❚❚ Pause';
              animFrameId = requestAnimationFrame(update);
            });
          } else {
            isPlaying = true;
            playBtn.innerHTML = '❚❚ Pause';
            animFrameId = requestAnimationFrame(update);
          }
        }
      }

      playBtn.addEventListener('click', togglePlay);

      restartBtn.addEventListener('click', () => {
        try { audio.pause(); } catch(e) {}
        audio.currentTime = 0;
        fallbackTime = 0;
        window.seekTo(0);
        if (isPlaying) {
          lastTimestamp = performance.now();
          audio.play().catch(() => {});
        }
      });

      timelineSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        audio.currentTime = val;
        fallbackTime = val;
        window.seekTo(val);
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        }
      });

      window.seekTo(0);
    });
  </script>
