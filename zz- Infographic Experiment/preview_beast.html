<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #070a12; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .row { display: flex; gap: 40px; margin-top: 20px; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <h1>Apex Inflation Beast: Proper Downward Jaw Swing</h1>
  <div class="row">
    <div class="card">
      <h3>State A: Attacking (Jaws Gaping Wide)</h3>
      <svg width="600" height="500" viewBox="-350 -260 700 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="beastSkin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="40%" stop-color="#dc2626"/>
            <stop offset="80%" stop-color="#991b1b"/>
            <stop offset="100%" stop-color="#450a0a"/>
          </linearGradient>
          <linearGradient id="beastBelly" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f87171"/>
            <stop offset="100%" stop-color="#b91c1c"/>
          </linearGradient>
          <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="60%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#d97706"/>
          </linearGradient>
          <filter id="monsterGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>
        
    <g id="apex_inflation_beast">
      <!-- Dark Crimson Aura Glow -->
      <radialGradient id="monsterAura" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#dc2626" stop-opacity="0.4"/>
        <stop offset="60%" stop-color="#7f1d1d" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#450a0a" stop-opacity="0"/>
      </radialGradient>
      <circle cx="30" cy="20" r="300" fill="url(#monsterAura)"/>

      <!-- 1. Obsidian Dorsal Spines -->
      <g id="dorsal_spikes">
        <polygon points="90,-120 180,-190 150,-80" fill="#0f172a" stroke="#450a0a" stroke-width="4"/>
        <polygon points="150,-70 240,-130 200,-30" fill="#1e1b4b" stroke="#0f172a" stroke-width="4"/>
        <polygon points="190,-10 270,-50 230,40" fill="#1e1b4b" stroke="#0f172a" stroke-width="4"/>
        <polygon points="210,50 280,30 240,100" fill="#0f172a" stroke="#450a0a" stroke-width="4"/>
      </g>

      <!-- 2. Muscular Arched Beast Body (Hunchback & Chest) -->
      <g id="beast_body">
        <!-- Muscular Torso -->
        <path d="M -30 -70 C 40 -130 150 -120 200 -50 C 250 20 250 110 200 170 C 150 220 50 210 -20 160 C -60 120 -60 70 -40 20 Z" 
              fill="url(#beastSkin)" stroke="#450a0a" stroke-width="8" stroke-linejoin="round"/>
        
        <!-- Shoulder & Back Highlights -->
        <path d="M 20 -90 C 90 -110 160 -70 180 -20" fill="none" stroke="#f87171" stroke-width="5.5" stroke-linecap="round" opacity="0.45"/>
        <path d="M 50 -50 C 120 -60 170 -10 190 40" fill="none" stroke="#f87171" stroke-width="4.5" stroke-linecap="round" opacity="0.35"/>
        
        <!-- Scaly Armored Chest / Underbelly -->
        <path d="M -20 40 C 20 130 90 150 150 130 C 120 90 70 50 10 30 Z" 
              fill="url(#beastBelly)" stroke="#450a0a" stroke-width="4.5"/>
        <path d="M 0 55 Q 45 55 105 85" stroke="#7f1d1d" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 20 95 Q 65 90 125 115" stroke="#7f1d1d" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 3. Great Curved Obsidian Horns (Sweeping Back from Skull) -->
      <g id="horns">
        <path d="M -10 -90 C 20 -170 100 -220 180 -200 C 110 -180 50 -140 40 -80 Z" 
              fill="#0f172a" stroke="#450a0a" stroke-width="6" stroke-linejoin="round"/>
        <path d="M 20 -150 C 60 -190 110 -200 160 -195" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

        <path d="M -40 -80 C -20 -140 40 -190 100 -180 C 60 -150 20 -120 10 -70 Z" 
              fill="#1e1b4b" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
      </g>

      <!-- 4. HINGED LOWER JAW & CAVERNOUS MOUTH (Swings DOWN when open) -->
      <g id="lower_jaw_rig" transform="translate(10, 25) rotate(28.0)">
        <!-- Deep Dark Cavernous Throat Interior -->
        <path d="M -190 10 C -120 -10 -10 -15 10 10 C -10 50 -100 70 -180 30 Z" fill="#180c10"/>
        
        <!-- Sinuous Forked Tongue -->
        <path d="M -120 8 Q -60 -8 0 10 Q -60 25 -120 18 Z" fill="#e11d48" stroke="#9f1239" stroke-width="3"/>
        
        <!-- Lower Jaw Bone Structure -->
        <path d="M -200 15 C -170 70 -60 90 20 15 C -10 80 -110 95 -190 40 Z" 
              fill="url(#beastSkin)" stroke="#450a0a" stroke-width="7" stroke-linejoin="round"/>

        <!-- Lower Jaw Razor Fangs (Points UP) -->
        <g id="lower_fangs">
          <polygon points="-190,15 -176,-24 -164,22" fill="#ffffff" stroke="#450a0a" stroke-width="3.5"/>
          <polygon points="-160,22 -146,-15 -134,26" fill="#ffffff" stroke="#450a0a" stroke-width="3"/>
          <polygon points="-130,26 -118,-6 -106,28" fill="#ffffff" stroke="#450a0a" stroke-width="3"/>
          <polygon points="-102,28 -92,4 -82,28" fill="#ffffff" stroke="#450a0a" stroke-width="2.5"/>
        </g>
      </g>

      <!-- 5. UPPER SNOUT & SKULL (Stationary Top) -->
      <g id="upper_skull_and_snout">
        <!-- Upper Snout Shape -->
        <path d="M -30 -80 C -100 -90 -180 -70 -230 -10 C -190 20 -120 15 -70 12 C -40 10 -25 -20 -30 -80 Z" 
              fill="url(#beastSkin)" stroke="#450a0a" stroke-width="8" stroke-linejoin="round"/>
        
        <!-- Snout Contour Highlight -->
        <path d="M -100 -70 C -160 -60 -200 -30 -220 -5" fill="none" stroke="#f87171" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

        <!-- Snorting Nostril with Glowing Smoke -->
        <ellipse cx="-205" cy="-18" rx="13" ry="8" fill="#180c10" transform="rotate(-15 -205 -18)"/>
        <path d="M -225 -25 Q -270 -50 -250 -85 Q -230 -50 -210 -35" fill="none" stroke="#fca5a5" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.7"/>
        <circle cx="-255" cy="-45" r="5" fill="#f59e0b"/>
        <circle cx="-275" cy="-65" r="7" fill="#ef4444"/>
        <circle cx="-290" cy="-55" r="4" fill="#fbbf24"/>

        <!-- Glowing Predatory Eye & Heavy Brow Ridge -->
        <g transform="translate(-100, -50)">
          <!-- Deep Dark Eye Socket -->
          <polygon points="-50,-10 10,-32 45,-6 10,18 -45,14" fill="#180c10" stroke="#450a0a" stroke-width="4"/>
          <!-- Glowing Sulfur Eyeball -->
          <ellipse cx="-2" cy="-4" rx="36" ry="17" fill="url(#eyeGlow)" stroke="#450a0a" stroke-width="3" transform="rotate(-8)"/>
          <!-- Sharp Vertical Slit Pupil -->
          <polygon points="-7,-16 -1,-4 -7,10 -12,-4" fill="#0f172a"/>
          <!-- Highlight Glint -->
          <circle cx="-12" cy="-8" r="4" fill="#ffffff"/>
          <circle cx="8" cy="-2" r="2" fill="#ffffff" opacity="0.8"/>
          <!-- Heavy Jagged Obsidian Brow Ridge -->
          <path d="M -62 -16 C -28 -42 20 -40 55 -5 C 20 -20 -20 -24 -50 -10 Z" fill="#0f172a" stroke="#450a0a" stroke-width="5"/>
        </g>

        <!-- UPPER JAW RAZOR FANGS (Points DOWN) -->
        <g id="upper_fangs">
          <polygon points="-80,10 -70,30 -60,10" fill="#ffffff" stroke="#450a0a" stroke-width="3"/>
          <polygon points="-110,10 -98,36 -86,10" fill="#ffffff" stroke="#450a0a" stroke-width="3"/>
          <polygon points="-140,8 -126,42 -114,9" fill="#ffffff" stroke="#450a0a" stroke-width="3.5"/>
          <!-- Massive Saber Canine -->
          <polygon points="-175,2 -158,54 -142,6" fill="#ffffff" stroke="#450a0a" stroke-width="4"/>
          <!-- Front Snout Fang -->
          <polygon points="-210,-4 -194,36 -182,2" fill="#ffffff" stroke="#450a0a" stroke-width="3.5"/>
        </g>
      </g>

      <!-- 6. PREDATOR ARM & SHARP TALONS (Reaching Out Forward) -->
      <g id="predator_arm" transform="translate(-20, 80) rotate(-10)">
        <!-- Muscular Arm -->
        <path d="M 20 -10 C -30 20 -90 45 -145 35" fill="none" stroke="#450a0a" stroke-width="32" stroke-linecap="round"/>
        <path d="M 20 -10 C -30 20 -90 45 -145 35" fill="none" stroke="url(#beastSkin)" stroke-width="24" stroke-linecap="round"/>
        <!-- Elbow Spike -->
        <polygon points="15,-15 55,-35 25,10" fill="#0f172a" stroke="#450a0a" stroke-width="3.5"/>

        <!-- Hand & 3 Wicked Curved Talons -->
        <g transform="translate(-145, 35)">
          <circle cx="0" cy="0" r="18" fill="#991b1b" stroke="#450a0a" stroke-width="4"/>
          <path d="M -8 -8 Q -40 -12 -55 -30 Q -32 4 -8 4 Z" fill="#ffffff" stroke="#450a0a" stroke-width="3"/>
          <path d="M -12 2 Q -50 8 -65 -5 Q -38 20 -10 14 Z" fill="#ffffff" stroke="#450a0a" stroke-width="3.5"/>
          <path d="M -8 12 Q -42 28 -50 18 Q -30 35 -6 20 Z" fill="#ffffff" stroke="#450a0a" stroke-width="3"/>
        </g>
      </g>

      <!-- 7. IMPACT CHOMP FX (Active when jaws snap shut) -->
      

      <!-- 8. HERALDIC GOLD & OBSIDIAN MONSTER PLAQUE -->
      <g transform="translate(90, -170)" filter="url(#monsterGlow)">
        <polygon points="-115,-30 115,-30 135,12 0,44 -135,12" fill="#0f172a" stroke="#f59e0b" stroke-width="5"/>
        <polygon points="-108,-25 108,-25 125,10 0,38 -125,10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2.5"/>
        <text x="0" y="2" font-family="'Montserrat', 'Impact', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">INFLATION</text>
        <text x="0" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="2.5">THE WEALTH DESTROYER</text>
      </g>
    </g>
    
      </svg>
    </div>

    <div class="card">
      <h3>State B: CHOMP! (Jaws Clamped Shut)</h3>
      <svg width="600" height="500" viewBox="-350 -260 700 520" xmlns="http://www.w3.org/2000/svg">
        <defs>

        <path d="M 20 95 Q 65 90 125 115" stroke="#7f1d1d" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 3. Great Curved Obsidian Horns (Sweeping Back from Skull) -->
      <g id="horns">
        <path d="M -10 -90 C 20 -170 100 -220 180 -200 C 110 -180 50 -140 40 -80 Z" 
              fill="#0f172a" stroke="#450a0a" stroke-width="6" stroke-linejoin="round"/>
        <path d="M 20 -150 C 60 -190 110 -200 160 -195" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

        <path d="M -40 -80 C -20 -140 40 -190 100 -180 C 60 -150 20 -120 10 -70 Z" 
              fill="#1e1b4b" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
      </g>

      <!-- 4. HINGED LOWER JAW & CAVERNOUS MOUTH (Swings DOWN when open) -->
      <g id="lower_jaw_rig" transform="translate(10, 25) rotate(0.0)">
        <!-- Deep Dark Cavernous Throat Interior -->
        <path d="M -190 10 C -120 -10 -10 -15 10 10 C -10 50 -100 70 -180 30 Z" fill="#180c10"/>
        
        <!-- Sinuous Forked Tongue -->
        <path d="M -120 8 Q -60 -8 0 10 Q -60 25 -120 18 Z" fill="#e11d48" stroke="#9f1239" stroke-width="3"/>
        
        <!-- Lower Jaw Bone Structure -->
        <path d="M -200 15 C -170 70 -60 90 20 15 C -10 80 -110 95 -190 40 Z" 
              fill="url(#beastSkin)" stroke="#450a0a" stroke-width="7" stroke-linejoin="round"/>

        <!-- Lower Jaw Razor Fangs (Points UP) -->
        <g id="lower_fangs">
          <polygon points="-190,15 -176,-24 -164,22" fill="#ffffff" stroke="#450a0a" stroke-width="3.5"/>

        </g>
      </g>

      <!-- 5. UPPER SNOUT & SKULL (Stationary Top) -->
      <g id="upper_skull_and_snout">
        <!-- Upper Snout Shape -->
        <path d="M -30 -80 C -100 -90 -180 -70 -230 -10 C -190 20 -120 15 -70 12 C -40 10 -25 -20 -30 -80 Z" 
              fill="url(#beastSkin)" stroke="#450a0a" stroke-width="8" stroke-linejoin="round"/>
        
        <!-- Snout Contour Highlight -->
        <path d="M -100 -70 C -160 -60 -200 -30 -220 -5" fill="none" stroke="#f87171" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

        <!-- Snorting Nostril with Glowing Smoke -->
